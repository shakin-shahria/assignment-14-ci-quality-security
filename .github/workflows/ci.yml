name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint code quality
        run: npm run lint

      - name: Build Docker image
        run: docker build -t assignment14-app:latest .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.0.27
        with:
          scan-type: filesystem
          scan-path: .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.0.27
        with:
          scan-type: image
          image-ref: assignment14-app:latest

      - name: Validate policy with OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          ./opa eval --input policy/input.json --data policy/deny-latest-tag.rego "data.docker.tag_allowed == true"

      - name: SonarCloud scan
        if: secrets.SONAR_TOKEN != ''
        uses: sonarsource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
